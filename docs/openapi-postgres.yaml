openapi: 3.0.3
info:
  title: 班客邦 PostgreSQL Command API
  version: 2026-08-03.1
  description: Staging transition API with accepted Auth0, Session/tenant boundaries, Time-Off, Announcement Center, real-event Notification Center, and standard Web Push delivery. Production cutover is not approved.
  x-baseline-commit: aa859e43ee7af880035229cbb177269a77988a97
  x-project-completion: 97
  x-staging-migration: 0013 through 0019 applied except intentionally pending 0009 and 0010
servers:
  - url: http://127.0.0.1:8080/v1
    description: Local development only
security:
  - BearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: Process is running }
  /readiness:
    get:
      security: []
      responses:
        '200': { description: Database is reachable }
        '500': { $ref: '#/components/responses/Error' }
  /auth/session:
    post:
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '201': { description: Local revocable session established after live membership authorization }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200': { description: Local session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /employees:
    get:
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200': { description: Active employees visible to boss or manager }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /time-off-requests:
    get:
      summary: Read role-scoped scheduled-leave and ad-hoc-leave request data
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Own requests, manager review data, and privacy-filtered same-store approved coverage
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /notifications:
    get:
      summary: Read notifications for the authenticated recipient
      description: Returns at most 100 notifications sorted unread first and then newest first.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Recipient-scoped notification list, unread count, and clock/leave/shift preferences
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /announcements:
    get:
      summary: List role-visible Workspace announcements newest first
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace-isolated announcements and recipient read state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Publish a Workspace announcement (manager only)
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementWrite' }
      responses:
        '201': { description: Announcement published and existing notification pipeline invoked }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /announcements/{announcementId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AnnouncementId'
    get:
      summary: Read one role-visible announcement
      responses:
        '200':
          description: Announcement detail
          content:
            application/json:
              schema:
                type: object
                required: [ok, workspaceId, item]
                properties:
                  ok: { type: boolean, enum: [true] }
                  workspaceId: { type: string }
                  item: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Update an announcement using optimistic revision control (manager only)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementUpdate' }
      responses:
        '200': { description: Announcement updated }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Soft-delete an announcement (manager only)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baseRevision]
              properties:
                baseRevision: { type: integer, minimum: 0 }
      responses:
        '200': { description: Announcement soft-deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /announcements/{announcementId}/read:
    post:
      summary: Mark one role-visible announcement and its existing notification as read
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AnnouncementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: Read marker persisted idempotently }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /push/status:
    get:
      summary: Read the current Session's active Web Push subscription count
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200': { description: Session-scoped push capability status }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /bootstrap:
    get:
      summary: Read the caller's role-visible bootstrap state
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Authorized bootstrap payload
          headers:
            X-Bootstrap-Revision:
              $ref: '#/components/headers/BootstrapRevision'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /bootstrap/revision:
    get:
      summary: Read the deterministic revision for the caller's role-visible bootstrap and time-off state
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Lightweight revision used to decide whether a full bootstrap refresh is necessary
          headers:
            X-Bootstrap-Revision:
              $ref: '#/components/headers/BootstrapRevision'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /commands/{commandName}:
    post:
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - in: path
          name: commandName
          required: true
          schema:
            type: string
            enum:
              - employees.create
              - shifts.create
              - leaves.replace-month
              - attendance.clock-in
              - attendance.clock-out
              - attendance.approve-hours
              - schedule-leave-requests.submit
              - schedule-leave-requests.cancel
              - leave-requests.submit
              - leave-requests.cancel
              - time-off-requests.approve
              - time-off-requests.reject
              - notifications.mark-read
              - notifications.mark-all-read
              - notifications.update-preferences
              - push.register
              - push.unregister
              - push.test
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: Idempotent replay }
        '201': { description: Command committed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
components:
  headers:
    BootstrapRevision:
      description: Non-negative safe-integer revision that must match the JSON response body.
      schema:
        type: integer
        minimum: 0
  parameters:
    WorkspaceId:
      in: header
      name: X-Workspace-Id
      required: true
      description: Untrusted requested workspace; authorization is resolved server-side from live membership.
      schema: { type: string, pattern: '^ws_[a-f0-9]{32}$' }
    AnnouncementId:
      in: path
      name: announcementId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    AnnouncementAudience:
      type: string
      enum: [ALL, MANAGER, EMPLOYEE]
    Announcement:
      type: object
      additionalProperties: false
      required: [id, title, content, audience, publishedAt, updatedAt, revision]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string, minLength: 1, maxLength: 10000 }
        audience: { $ref: '#/components/schemas/AnnouncementAudience' }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        revision: { type: integer, minimum: 0 }
    AnnouncementWrite:
      type: object
      additionalProperties: false
      required: [title, content, audience]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string, minLength: 1, maxLength: 10000 }
        audience: { $ref: '#/components/schemas/AnnouncementAudience' }
    AnnouncementUpdate:
      type: object
      additionalProperties: false
      required: [title, content, audience, baseRevision]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string, minLength: 1, maxLength: 10000 }
        audience: { $ref: '#/components/schemas/AnnouncementAudience' }
        baseRevision: { type: integer, minimum: 0 }
    AnnouncementList:
      type: object
      required: [ok, workspaceId, items, unreadCount]
      properties:
        ok: { type: boolean, enum: [true] }
        workspaceId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/Announcement' }
        unreadCount: { type: integer, minimum: 0 }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Auth0 OIDC access token (RS256)
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            type: object
            required: [ok, error, code, requestId]
            properties:
              ok: { type: boolean, enum: [false] }
              error: { type: string }
              code: { type: string }
              requestId: { type: string }
